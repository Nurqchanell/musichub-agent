name: MusicHub TR Daily 08:00

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scout-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml feedparser
      - env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python agent_musichub_final_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: musichub-rapor-${{ github.run_number }}
          path: |
            ham_haberler.json
            canli_yayin_metni.txt
            instagram_caption.txt
            hukuk_raporu.json
