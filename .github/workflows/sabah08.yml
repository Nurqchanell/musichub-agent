 name: MusicHub TR Daily 08:00

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scout-and-editor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Kutuphaneler yukle - FREE
        run: |
          pip install requests beautifulsoup4 lxml feedparser

      - name: Agent calistir
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python agent_musichub_final_cloud.py

      - name: Dosyalari artifact olarak kaydet
        uses: actions/upload-artifact@v5
        with:
          name: musichub-rapor-${{ github.run_number }}
          path: |
            ham_haberler.json
            canli_yayin_metni.txt
            instagram_caption.txt
            hukuk_raporu.json
